name: Dance real-browser visual smoke
on:
  push:
    branches: [feature/hoja-nahan-dance-solo-coop-20261113]
    paths: ['.github/workflows/dance-browser-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check chrome and standalone bundle
        run: |
          python3 build.py --check
          which google-chrome || which google-chrome-stable || which chromium
          node --version
      - name: Install browser automation library
        run: npm install --no-save playwright-core@1.56.0
      - name: Smoke test both game modes in real Chrome
        run: |
          python3 -m http.server 8765 >/tmp/dance-http.log 2>&1 &
          sleep 2
          node <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1600,height:900},hasTouch:true});
            page.setDefaultTimeout(10000);
            const errors=[];
            page.on('pageerror',err=>errors.push(err.message));
            const base='http://127.0.0.1:8765/';
            for(const [mode,stage,count] of [
              ['solo','1인 · 쉬움',1],
              ['duet','2인 협동 · 쉬움',2]
            ]){
              await page.goto(base,{waitUntil:'domcontentloaded'});
              await page.locator('#menuPage4').click();
              assert.equal(await page.locator('#rhythmGrid .game-card').count(),10);
              await page.locator('#openParty-dance').click();
              await page.locator('#stageList .stage-card',{hasText:stage}).click();
              await page.locator('#choiceStart').click();
              await page.locator('#skipIntro').click();
              await page.locator('.da-picker .da-song').first().waitFor({state:'visible'});
              await page.locator('.da-picker .da-song').first().tap();
              await page.locator('.da-key').first().waitFor({state:'visible'});
              assert.equal(await page.locator('.da-key').count(),count);
              await page.waitForTimeout(600);
              const stats=await page.evaluate(()=>{
                const c=document.querySelector('.da-canvas');
                const r=c.getBoundingClientRect();
                const p=c.getContext('2d').getImageData(Math.max(0,Math.floor(c.width*.5)),Math.max(0,Math.floor(c.height*.25)),1,1).data;
                return {width:r.width,height:r.height,pixel:[...p],title:document.querySelector('#paCaption')?.textContent};
              });
              assert.ok(stats.width>500&&stats.height>200);
              assert.ok(stats.pixel[3]>0,'canvas should render an opaque board');
              assert.match(stats.title,/호자와 나한상의 춤/);
              await page.screenshot({path:'/tmp/dance-'+mode+'.png',fullPage:true});
              console.log(mode+' PASS: '+JSON.stringify(stats));
            }
            assert.deepEqual(errors,[],'Uncaught browser errors');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dance-chrome-smoke-screenshots
          path: /tmp/dance-*.png
