name: Responsive game headline review
on:
  push:
    branches: [codex/responsive-game-labels]
    paths: ['.github/workflows/responsive-headlines.yml']
  pull_request:
    branches: [main]
    paths:
      - 'src/css/style.css'
      - 'src/js/core.js'
      - 'src/js/controls.js'
      - 'src/js/hockey.js'
      - 'tests/responsive-headlines-browser.cjs'
      - '.github/workflows/responsive-headlines.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build from candidate source and run game regressions
        run: |
          node --test tests/*.test.js
          python3 build.py
          python3 build.py --check
      - name: Browser headline geometry and existing refund layout regression
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix /tmp/hoja-headline --no-audit --no-fund --no-package-lock playwright@1.55.0
          NODE_PATH=/tmp/hoja-headline/node_modules node tests/responsive-headlines-browser.cjs
          NODE_PATH=/tmp/hoja-headline/node_modules node tests/refund-ui-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: responsive-headline-candidate
          path: index.html
          if-no-files-found: error

  publish-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/responsive-game-labels'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Rebuild and commit generated page to review branch only
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0ebe0bfd47abee30df07868bc5555d672d930fcf HEAD
          test "$(git diff --name-only 0ebe0bfd47abee30df07868bc5555d672d930fcf HEAD)" = .github/workflows/responsive-headlines.yml
          python3 build.py
          python3 build.py --check
          sha256sum index.html
          git add -- index.html
          test "$(git diff --cached --name-only)" = index.html
          git config user.name "hoja-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild minigame HTML for approved responsive headline release"
          git push origin HEAD:refs/heads/codex/responsive-game-labels
