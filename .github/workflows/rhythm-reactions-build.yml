name: Rhythm character reactions verified build (review branch only)
on:
  push:
    branches: [feat/rhythm-faces-reactions-20261122]
    paths: ['.github/workflows/rhythm-reactions-build.yml']
permissions:
  contents: write
jobs:
  verify-and-build:
    if: github.ref == 'refs/heads/feat/rhythm-faces-reactions-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Validate rhythm and full game logic
        run: |
          set -euo pipefail
          node --test tests/*.test.js
          python3 build.py
          python3 build.py --check
          python3 - <<'PY'
          import pathlib,re,subprocess,tempfile
          html=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',html,re.I)
          with tempfile.TemporaryDirectory() as d:
            count=0
            for attrs,body in scripts:
              if not body.strip() or re.search(r'\bsrc\s*=',attrs,re.I):continue
              p=pathlib.Path(d)/f'{count}.js';p.write_text(body)
              subprocess.run(['node','--check',str(p)],check=True)
              count+=1
          assert count>0
          print('PASS: built inline JS syntax, scripts:',count)
          PY
      - name: Verify tablet and board avatar layout in Chromium
        run: |
          npm install --prefix /tmp/hoja-rhythm-browser --no-audit --no-fund --no-package-lock playwright@1.55.0
          /tmp/hoja-rhythm-browser/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/hoja-rhythm-browser/node_modules node tests/rhythm-layout-browser.cjs
      - name: Commit reproducible single-file game into review branch only
        run: |
          set -euo pipefail
          git add -- index.html
          test "$(git diff --cached --name-only)" = index.html
          git config user.name "hoja-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(rhythm): regenerate verified mini-game page with expressive faces"
          git push origin HEAD:refs/heads/feat/rhythm-faces-reactions-20261122
