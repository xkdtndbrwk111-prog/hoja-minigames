name: Lesson-end guard candidate build
on:
  push:
    branches: [codex/lesson-end-guard]
    paths: ['.github/workflows/lesson-end-guard.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Logic regressions and reproducible build
        run: |
          set -euo pipefail
          node --check src/js/lesson-end.js
          node --test tests/*.test.js
          python3 build.py
          python3 build.py --check
          sha256sum index.html
      - name: Regenerate candidate on review branch only
        run: |
          set -euo pipefail
          git add -- index.html
          test "$(git diff --cached --name-only)" = index.html
          git config user.name "hoja-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate lesson-end guard candidate"
          git push origin HEAD:refs/heads/codex/lesson-end-guard
