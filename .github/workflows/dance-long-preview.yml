name: Verify longer dance and free character choice
on:
  push:
    branches: [feature/dance-longer-free-character-20261113]
    paths: ['src/**','tests/dance-logic.test.js','.github/workflows/dance-long-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone application
        run: python3 build.py && python3 build.py --check
      - name: Pure timing, scoring, six-mode regression tests
        run: |
          node tests/dance-logic.test.js
          python3 - <<'PY'
          import build
          from pathlib import Path
          Path('/tmp/hoja-app-check.js').write_text(''.join(build.read(p) for p in build.MAIN_JS))
          html=Path('index.html').read_text()
          assert 'targetSeconds:100' in html
          assert 'dance_solo' in html and 'dance_duo' in html
          assert "const danceChoices=['HOJA','NAHANSANG']" in html
          print('Bundled dance menu, selected characters and scoreboards PASS')
          PY
          node --check /tmp/hoja-app-check.js
      - name: Start local game and install browser controller
        run: |
          npm install --no-save playwright-core@1.56.0
          python3 -m http.server 8765 >/tmp/dance-long-server.log 2>&1 &
          sleep 2
      - name: Real Chrome interaction: 7 selectable characters and both modes
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:1600,height:900},hasTouch:true});
              page.setDefaultTimeout(10000);
              const errors=[];
              page.on('pageerror',err=>errors.push(err.message));
              for(const [mode,stage,pads] of [
                ['solo','1인 · 보통',1],
                ['duo','2인 협동 · 어려움',2]
              ]){
                await page.goto('http://127.0.0.1:8765/?mode=board',{waitUntil:'domcontentloaded'});
                await page.locator('#menuPage4').click();
                await page.locator('#openParty-dance').click();
                assert.equal(await page.locator('#choiceLeft .character-card').count(),7);
                assert.equal(await page.locator('#choiceRight .character-card').count(),7);
                await page.locator('#choiceLeft .character-card[data-id="SUMAKSAE"]').click();
                await page.locator('#choiceRight .character-card[data-id="GWANGGAETO_KING"]').click();
                assert.match(await page.locator('#previewNameLeft').textContent(),/수막새/);
                assert.match(await page.locator('#previewNameRight').textContent(),/광개토대왕/);
                await page.locator('#stageList .stage-card',{hasText:stage}).click();
                await page.locator('#choiceStart').click();
                await page.locator('#skipIntro').click();
                await page.locator('.da-picker .da-song').first().tap();
                await page.locator('.da-key').first().waitFor({state:'visible'});
                assert.equal(await page.locator('.da-key').count(),pads);
                assert.match(await page.locator('#paHint').textContent(),/수막새/);
                assert.match(await page.locator('#paHint').textContent(),/광개토대왕/);
                if(pads===2){
                  assert.match(await page.locator('.da-key-a').textContent(),/수막새/);
                  assert.match(await page.locator('.da-key-b').textContent(),/광개토대왕/);
                }
                await page.waitForTimeout(300);
                const canvas=await page.locator('.da-canvas').evaluate(c=>{
                  const b=c.getBoundingClientRect();
                  const d=c.getContext('2d').getImageData(Math.floor(c.width/2),Math.floor(c.height/4),1,1).data;
                  return {w:b.width,h:b.height,alpha:d[3]};
                });
                assert.ok(canvas.w>1000&&canvas.h>400&&canvas.alpha===255,'rendering dimensions');
                console.log('PASS '+mode+' real Chrome: '+JSON.stringify(canvas));
              }
              assert.deepEqual(errors,[],'No uncaught JS errors');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
      - name: Commit compiled index to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "build: longer dance with free character selection [skip ci]"
            git push
          fi
