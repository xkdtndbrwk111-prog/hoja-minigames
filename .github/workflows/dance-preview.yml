name: Dance 1P and 2P preview verification
on:
  push:
    branches: [feature/hoja-nahan-dance-solo-coop-20261113]
    paths: ['src/**','build.py','tests/**','.github/workflows/dance-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone index.html
        run: python3 build.py && python3 build.py --check
      - name: Run solo/duet chart and input tests
        run: node tests/dance-logic.test.js
      - name: Verify all concatenated JavaScript syntax
        run: |
          python3 - <<'PY'
          import build
          from pathlib import Path
          Path('/tmp/hoja-minigame-app.js').write_text(''.join(build.read(p) for p in build.MAIN_JS),encoding='utf8')
          h=Path('index.html').read_text()
          assert '호자와 나한상의 춤' in h
          assert 'daChart(song,stage)' in h
          assert 'hoja-airhockey-board-lag' in h
          assert 'dance_duo' in h and 'dance_solo' in h
          assert "'js/dance.js'" in Path('build.py').read_text()
          print('Dance bundle, board calibration and leaderboard references PASS')
          PY
          node --check /tmp/hoja-minigame-app.js
      - name: Commit generated standalone HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "build: compile Hoja and Nahan dance into standalone game [skip ci]"
            git push
          fi
