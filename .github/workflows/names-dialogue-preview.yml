name: Verify student names and complete dialogue
on:
  push:
    branches: [fix/student-names-dialogue-fulltext-20261113]
    paths: ['src/**', 'build.py', '.github/workflows/names-dialogue-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone mini-game
        run: python3 build.py && python3 build.py --check
      - name: Check compiled JS syntax and student mapping
        run: |
          python3 - <<'PY'
          import build
          from pathlib import Path
          Path('/tmp/hoja-minigames.js').write_text(''.join(build.read(p) for p in build.MAIN_JS))
          c=Path('src/js/coins.js').read_text()
          h=Path('src/js/hall-of-fame.js').read_text()
          s=Path('src/js/stairs.js').read_text()
          css=Path('src/css/style.css').read_text()
          assert 'HOF.playerNames[i]=st&&st.name' in c
          assert 'HOF.playerNames[side]=String(given).trim()' in c
          assert 'function gamePlayerName(player)' in h
          assert 'const stName=i=>gamePlayerName(i)' in s
          assert 'text-overflow:clip;overflow-wrap:anywhere' in css
          assert 'gamePlayerName(0)' in Path('src/js/hockey.js').read_text()
          assert 'gamePlayerName(0)' in Path('src/js/bakery.js').read_text()
          assert 'gamePlayerName(i)' in Path('src/js/party/page1.js').read_text()
          htm=Path('index.html').read_text()
          assert 'function gamePlayerName(player)' in htm
          print('All source and bundle checks PASS')
          PY
          node --check /tmp/hoja-minigames.js
      - name: Update bundled page on preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "build: compile names and complete dialogue [skip ci]"
            git push
          fi
