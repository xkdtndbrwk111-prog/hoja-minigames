name: Bubble stage retirement release
on:
  push:
    branches: [fix/remove-bubble-easy]
    paths: ['.github/workflows/bubble-stage-retirement.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify
        run: |
          set -euo pipefail
          node --check src/js/bubble.js
          node --check src/js/tournament.js
          node --test tests/*.test.js
          python3 build.py
          python3 build.py --check
      - name: Publish verified build
        run: |
          set -euo pipefail
          git add -- index.html
          test "$(git diff --cached --name-only)" = index.html
          git config user.name "hoja-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: retire Bubble three-color stage"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/fix/remove-bubble-easy
          git push origin HEAD:refs/heads/main
