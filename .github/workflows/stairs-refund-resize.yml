name: Stairs refund canvas build and regression
on:
  push:
    branches: [fix/stairs-refund-canvas-height-20261123]
    paths:
      - src/js/stairs.js
      - tests/stairs-refund-resize.test.js
      - .github/workflows/stairs-refund-resize.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rebuild published page and compare to exact source
        run: |
          set -euo pipefail
          python3 build.py
          python3 build.py --check
      - name: Run unit and regression tests
        run: node --test tests/*.test.js
      - name: Browser refund layout regression
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix /tmp/hoja-stairs-ui --no-audit --no-fund --no-package-lock playwright@1.55.0
          NODE_PATH=/tmp/hoja-stairs-ui/node_modules node tests/refund-ui-browser.cjs
      - name: Commit generated HTML to review branch (after tests)
        run: |
          set -euo pipefail
          git add -- index.html
          if ! git diff --cached --quiet; then
            git config user.name "hoja-build"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(stairs): regenerate HTML with canvas-height fix"
            git push origin HEAD:refs/heads/fix/stairs-refund-canvas-height-20261123
          fi
