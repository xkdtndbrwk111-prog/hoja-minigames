name: Apply air hockey goal-camping patch
on:
  push:
    branches: [feat/air-hockey-goal-camping-20261111]
    paths: [.github/workflows/goal-camping-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate
        run: |
          python3 tools/patch_goal_camping.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.index('<script>(() => {')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/hoja-air-hockey.js').write_text(s[start:end])
          PY
          node --check /tmp/hoja-air-hockey.js
          git diff --check
      - name: Commit patched bundled HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(air-hockey): widen goal after 3s of close goalie camping"
          git push origin HEAD:feat/air-hockey-goal-camping-20261111
