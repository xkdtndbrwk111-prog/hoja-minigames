name: Refund, bakery and stair contact UI review
on:
  push:
    branches: [codex/refund-bottom-bakery]
    paths: ['.github/workflows/refund-bottom-bakery.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/codex/refund-bottom-bakery'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Verify tournament engine and build exact source
        run: |
          set -euo pipefail
          node --test tests/*.test.js
          python3 build.py
          python3 build.py --check
          python3 - <<'PY'
          import re,pathlib,tempfile,subprocess
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',pathlib.Path('index.html').read_text(),re.I)
          with tempfile.TemporaryDirectory() as d:
              for i,(attrs,body) in enumerate(scripts):
                  if body.strip() and not re.search(r'\bsrc\s*=',attrs,re.I):
                      p=pathlib.Path(d)/f'{i}.js';p.write_text(body);subprocess.run(['node','--check',str(p)],check=True)
          PY
          sha256sum index.html
      - name: Browser integration with recovery and dual selection
        run: node tests/tournament-browser.cjs
      - name: Refund button browser geometry, start and stair portrait anchors
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix /tmp/hoja-refund-ui --no-audit --no-fund --no-package-lock playwright@1.55.0
          NODE_PATH=/tmp/hoja-refund-ui/node_modules node tests/refund-ui-browser.cjs
      - name: Commit generated page to review branch only
        run: |
          set -euo pipefail
          git add -- index.html
          test "$(git diff --cached --name-only)" = index.html
          git config user.name "hoja-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild minigame HTML for refund and bakery UI review"
          git push origin HEAD:refs/heads/codex/refund-bottom-bakery
