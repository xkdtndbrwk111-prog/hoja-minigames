name: Verify family hall of fame and lightning records
on:
  push:
    branches: [feat/hof-family-groups-fresh-start-20261113]
    paths: ['src/**','build.py','.github/workflows/hof-family-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild single-file mini-games
        run: python3 build.py && python3 build.py --check
      - name: Verify score categories, grouped UI, and JS syntax
        run: |
          python3 - <<'PY'
          import build
          from pathlib import Path
          Path('/tmp/hoja-hof-bundle.js').write_text(''.join(build.read(p) for p in build.MAIN_JS))
          hall=Path('src/js/hall-of-fame.js').read_text()
          coins=Path('src/js/coins.js').read_text()
          flash=Path('src/js/party/flash.js').read_text()
          css=Path('src/css/style.css').read_text()
          page=Path('index.html').read_text()
          for game in ['flash_solo','flash_r8','flash_r12']:
            assert "id:'"+game+"'" in hall
            assert "hofRecord(" in flash and game in flash
            assert game in page
          assert "id:'stairs'" not in hall
          assert "id:'jump'" not in hall
          assert "id:'shop'" not in hall
          assert "이전 기록" not in hall
          assert 'const groups=new Map()' in coins
          assert "if(currentGame==='flash')" in coins
          assert "if(!RALLY.on)" in flash
          assert '.hof-mode-grid{' in css
          print('HOF grouping, retired scores, lightning modes: PASS')
          PY
          node --check /tmp/hoja-hof-bundle.js
      - name: Commit generated index in preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "build: grouped hall of fame with lightning missions [skip ci]"
            git push
          fi
